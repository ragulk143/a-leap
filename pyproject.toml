[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-leap"
version = "0.1.0"
description = "A high-performance GPU-first asynchronous streaming inference engine for massive LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0"
]

[project.scripts]
aleap = "aleap.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["aleap*"]
exclude = ["venv*", "tests*", "benchmarks*", "csrc*"]

[tool.setuptools.package-data]
aleap = ["api/static/*.html"]
